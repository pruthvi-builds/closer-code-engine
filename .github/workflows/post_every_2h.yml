name: Post to Instagram every 2 hours

on:
  schedule:
    # GitHub's own scheduler has proven unreliable for this repo -- it has
    # gone completely silent for 8+ hours at a stretch despite a correctly
    # configured "every 2 hours" cron. Rather than depend on GitHub hitting
    # one exact instant every 2 hours, this fires 3x/hour (every ~20 min,
    # offset off the top-of-hour congestion window) and an internal gate
    # (see "Check if a post is due" below) decides whether it's actually
    # time to post. This gives GitHub's scheduler 6 chances per 2-hour
    # window instead of 1 -- a full posting gap now requires 6 consecutive
    # missed slots instead of 1. "Not due" runs exit in a few seconds and
    # cost nothing extra (public repos get unlimited free Actions minutes).
    - cron: "7,27,47 * * * *"
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

permissions:
  contents: write   # needed to commit newly rendered assets back to the repo

# Serialize runs instead of letting an overlapping manual trigger race a
# scheduled run (or vice versa) -- concurrent jobs both doing "git add,
# commit, push" to main can conflict on the push, and worse, could
# theoretically publish two posts in the same window. Queue instead of
# canceling, so a manual trigger never eats a real scheduled post.
concurrency:
  group: post-to-instagram
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Cheap, fast gate that runs BEFORE installing ffmpeg/deps so a
      # "not due yet" run finishes in seconds. Reads the timestamp of the
      # last CONFIRMED successful post (content_data/content_log.csv only
      # gets a row written after a real successful publish -- see
      # caption_engine.mark_posted) and only proceeds if at least ~110
      # minutes have passed. Applies to every trigger source uniformly.
      - name: Check if a post is due
        id: gate
        run: |
          python3 - << 'PYEOF'
          import csv, datetime, os

          # IMPORTANT: workflow_dispatch is no longer a "human clicked a
          # button" signal -- cron-job.org calls this same trigger via the
          # GitHub API every ~15 minutes as our reliability heartbeat (see
          # the schedule comment above). If workflow_dispatch bypassed the
          # gate, EVERY heartbeat would post, which is exactly the
          # over-posting bug this fixes. The elapsed-time gate now applies
          # uniformly regardless of what triggered the run. A genuine
          # manual test can still force a post at any time by deleting the
          # last row of content_data/content_log.csv first, or just editing
          # this file temporarily.
          path = "content_data/content_log.csv"
          due, reason = True, "no post log yet"
          if os.path.exists(path):
              with open(path) as f:
                  rows = list(csv.DictReader(f))
              if rows:
                  last_ts = datetime.datetime.fromisoformat(rows[-1]["timestamp"])
                  elapsed_min = (datetime.datetime.utcnow() - last_ts).total_seconds() / 60
                  due = elapsed_min >= 110
                  reason = f"last confirmed post was {elapsed_min:.1f} min ago"

          print(f"{reason} -> due={due}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"due={'true' if due else 'false'}\n")
          PYEOF

      - name: Install ffmpeg + deps
        if: steps.gate.outputs.due == 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install -r requirements.txt

      # PUBLIC_BASE_URL is not sensitive (it's just this repo's public CDN
      # path), so it's hardcoded here rather than requiring a repo secret —
      # keeps the trial runnable with zero secrets configured.
      - name: Render this run's post (step 1)
        if: steps.gate.outputs.due == 'true'
        env:
          PUBLIC_BASE_URL: https://cdn.jsdelivr.net/gh/pruthvi-builds/closer-code-engine@main/assets/renders
        run: python scripts/main.py render

      - name: Commit + push rendered assets so they go public
        if: steps.gate.outputs.due == 'true'
        run: |
          git config user.name "content-bot"
          git config user.email "content-bot@users.noreply.github.com"
          git add assets/renders content_data
          git diff --cached --quiet || git commit -m "Auto render $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          # Retry on push rejection (e.g. another run pushed in between)
          # instead of failing the whole job outright -- rebase onto
          # whatever's now on main and try again, a few times.
          for i in 1 2 3 4 5; do
            git push && break
            echo "push rejected, rebasing and retrying ($i/5)..."
            git pull --rebase origin main
            sleep $((i * 5))
          done

      - name: Wait for jsDelivr CDN to pick up the new commit
        if: steps.gate.outputs.due == 'true'
        run: sleep 90

      # DRY_RUN is hardcoded true for this trial so it runs safely with zero
      # secrets configured (an empty/unset secret would NOT fall back to
      # "true" automatically, so this must be explicit). Once you've
      # completed Meta's approval process (see README) and want to go live:
      # add IG_USER_ID / IG_ACCESS_TOKEN as repo secrets under Settings ->
      # Secrets and variables -> Actions, then change the line below to
      # DRY_RUN: "false".
      - name: Publish to Instagram (step 2)
        if: steps.gate.outputs.due == 'true'
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          DRY_RUN: "false"
          PUBLIC_BASE_URL: https://cdn.jsdelivr.net/gh/pruthvi-builds/closer-code-engine@main/assets/renders
        run: python scripts/main.py publish

      # main.py publish() only marks a hook "used" in content_log.csv AFTER
      # a confirmed successful publish (see caption_engine.mark_posted) --
      # which happens AFTER the "Commit + push rendered assets" step above
      # already ran. Without this second commit, that write only exists in
      # the ephemeral runner filesystem and is lost when the job ends,
      # silently breaking both the anti-repeat log and this workflow's own
      # "is a post due" gate (both read content_log.csv's last timestamp).
      - name: Commit + push the updated content log
        if: steps.gate.outputs.due == 'true'
        run: |
          git config user.name "content-bot"
          git config user.email "content-bot@users.noreply.github.com"
          git add content_data/content_log.csv
          git diff --cached --quiet || git commit -m "Log confirmed post $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          for i in 1 2 3 4 5; do
            git push && break
            echo "push rejected, rebasing and retrying ($i/5)..."
            git pull --rebase origin main
            sleep $((i * 5))
          done
